# Production docker-compose
version: '3.8'

# Every Django process (web, worker, beat) loads the same production settings,
# so they share one env file. Copy .env.production.example to .env.production
# and fill it in; never commit the filled-in file.
x-django-env: &django-env
  DJANGO_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-hms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hms_prod}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
  BACKUP_STORAGE_PATH: /backups

x-django-service: &django-service
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  env_file:
    - .env.production
  environment:
    <<: *django-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hms-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hms_prod}
      POSTGRES_USER: ${POSTGRES_USER:-hms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"  # Only accessible locally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hms_user} -d ${POSTGRES_DB:-hms_prod}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Redis
  redis:
    image: redis:7-alpine
    container_name: hms-redis-prod
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    ports:
      - "127.0.0.1:6379:6379"  # Only accessible locally
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Backend (Django + Gunicorn)
  backend:
    <<: *django-service
    container_name: hms-backend-prod
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-4}
      --worker-class gthread
      --threads ${GUNICORN_THREADS:-2}
      --timeout ${GUNICORN_TIMEOUT:-60}
      --keep-alive 5
      --max-requests 1000
      --max-requests-jitter 100
      --access-logfile -
      --error-logfile -
      --log-level info
      --preload
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "true"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - ./logs:/app/logs
      - ./backups:/backups
    ports:
      - "127.0.0.1:8000:8000"  # Only accessible locally (via nginx)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Celery Worker
  celery-worker:
    <<: *django-service
    container_name: hms-celery-worker-prod
    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
      --prefetch-multiplier=1
      --max-tasks-per-child=1000
      -Q default,notifications,reports,ai_processing,audit,maintenance
    volumes:
      - media:/app/media
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Celery Beat (scheduler)
  celery-beat:
    <<: *django-service
    container_name: hms-celery-beat-prod
    command: >
      celery -A config beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Frontend (Nginx serving static React app)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hms-frontend-prod
    # No external ports - only accessible via nginx reverse proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Nginx Reverse Proxy (separate from frontend for SSL termination)
  nginx:
    image: nginx:alpine
    container_name: hms-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx-entrypoint.sh:/entrypoint.sh:ro
      - ./ssl:/etc/nginx/ssl:ro
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro
    entrypoint: ["/entrypoint.sh"]
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  postgres_prod_data:
  redis_prod_data:
  staticfiles:
  media:

networks:
  default:
    name: hms-prod-network