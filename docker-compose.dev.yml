# Development docker-compose
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hms-postgres-dev
    environment:
      POSTGRES_DB: hms_dev
      POSTGRES_USER: hms_user
      POSTGRES_PASSWORD: hms_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_user -d hms_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: hms-redis-dev
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Django)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    container_name: hms-backend-dev
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DJANGO_ENV=development
      - DJANGO_SECRET_KEY=django-insecure-dev-key-change-in-production
      - DATABASE_URL=postgres://hms_user:hms_password@postgres:5432/hms_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,backend
      - GOOGLE_CLIENT_ID=1199500530711-s1ti1g061cno8d3tk2759hqrgitdect.apps.googleusercontent.com
      - AI_SCRIBE_API_KEY=
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__/
            - *.pyc
            - .pytest_cache/
            - db.sqlite3

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    container_name: hms-celery-worker-dev
    command: celery -A config worker --loglevel=info --concurrency=2
    environment:
      - DJANGO_ENV=development
      - DJANGO_SECRET_KEY=django-insecure-dev-key-change-in-production
      - DATABASE_URL=postgres://hms_user:hms_password@postgres:5432/hms_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=True
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat (scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    container_name: hms-celery-beat-dev
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_ENV=development
      - DJANGO_SECRET_KEY=django-insecure-dev-key-change-in-production
      - DATABASE_URL=postgres://hms_user:hms_password@postgres:5432/hms_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend (Vite dev server)
  frontend:
    image: node:20-alpine
    container_name: hms-frontend-dev
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  default:
    name: hms-dev-network